# AyanomiBancho Configuration

[server]
host = "127.0.0.1"         # Safe default. Use AYANOMI_BIND_HOST=0.0.0.0 only behind a TLS reverse proxy/firewall.
port = 5000               # Gateway port (osu! client connects here via -devserver)
bancho_port = 5001        # Bancho packet engine internal port
web_port = 5002           # Web, API, and Dashboard internal port
domain = "127.0.0.1:5000"
name = "AyanomiBancho"
welcome_message = "Welcome to AyanomiBancho! Enjoy your stay."
secret_key = "" # Set AYANOMI_SESSION_SECRET to a random value of at least 32 bytes.

[gameplay]
auto_register = true
default_country = 233     # 233: Vietnam, 225: US, 111: Japan, ...
bot_name = "Miku"
bot_id = 3

[security]
anti_multiaccount = false    # Tắt kiểm tra multiaccount khi dev/local test để tạo tài khoản thoải mái
max_accounts_per_hwid = 3
block_vpn = false

[database]
path = "data/ayanomi.db"
chat_path = "data/ayanomi_chat.db"
badges_path = "data/ayanomi_badges.db"
auto_backup = true
backup_interval_minutes = 60
max_backups_kept = 5

[mirrors]
direct_search_api = "https://mirror.hinamizawa.ai/api/v1/hinai/search"
download_url = "https://mirror.hinamizawa.ai/api/v1/hinai/d/{}"
beatmap_md5_api = "https://mirror.hinamizawa.ai/v3/osu/beatmaps/md5/{}"

[menu_backgrounds]
enabled = true
directory = "data/backgrounds"
artist_name = "AyanomiBancho"

[ratelimit]
enabled = true
# Số request tối đa mỗi phút theo từng phân tầng (Rate Limit Tiers) - Đã nới lỏng cho trải nghiệm mượt mà
general_rpm = 3600       # Web dashboard, telemetry, status, avatars (3600 req/min = 60 req/s)
bancho_rpm = 3600        # Bancho packet client pings & gameplay (3600 req/min = 60 req/s)
direct_rpm = 1800        # osu!Direct map search & download (1800 req/min = 30 req/s)
sensitive_rpm = 180      # Login, đăng ký, nộp điểm và upload (180 req/min = 3 req/s)
whitelist_private = true # Miễn rate limit cho mạng LAN / localhost (127.0.0.1)

[turnstile]
enabled = false                 # Chỉ bật sau khi đã cấu hình TURNSTILE_SECRET và hostname chính xác
site_key = ""
secret_key = ""                  # Nhập secret key Cloudflare của bạn tại đây hoặc set biến môi trường TURNSTILE_SECRET
expected_action = "login"
expected_hostnames = ["127.0.0.1", "localhost"]
