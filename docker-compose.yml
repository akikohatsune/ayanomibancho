version: '3.8'

services:
  ayanomibancho:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayanomibancho:latest
    container_name: ayanomibancho
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=info
      - AYANOMI_BIND_HOST=0.0.0.0
      - AYANOMI_SESSION_SECRET=${AYANOMI_SESSION_SECRET:?Set a random secret of at least 32 bytes}
