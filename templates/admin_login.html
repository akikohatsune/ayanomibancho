<div class="glass-card" style="max-width: 480px; margin: 6rem auto; padding: 2.8rem 2.2rem; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 1rem; filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.3));">🛡️</div>
    <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.4px;">{{GATE_TITLE}}</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0.8rem 0 2rem; line-height: 1.6;">
        {{GATE_MESSAGE}}
    </p>
    <div style="display: flex; justify-content: center; margin-bottom: 1.6rem;">
        {{GATE_BUTTON}}
    </div>
    <div style="font-size: 0.88rem;">
        <a href="/" style="color: var(--text-muted); text-decoration: none;">&larr; Back to Website</a>
    </div>
</div>
