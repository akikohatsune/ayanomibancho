<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <title>{{TITLE}} - {{SERVER_NAME}}</title>

    <!-- Discord & Open Graph / SEO Meta Tags -->
    <meta name="theme-color" content="#f472b6">
    <meta name="description" content="A lightweight, high-performance osu! private server powered by Rust with custom PP calculation, live Bancho multiplayer, and global leaderboards.">

    <!-- Open Graph (Facebook, Discord, Telegram, etc.) -->
    <meta property="og:site_name" content="{{SERVER_NAME}}">
    <meta property="og:title" content="{{TITLE}} - {{SERVER_NAME}}">
    <meta property="og:description" content="A lightweight, high-performance osu! private server powered by Rust with custom PP calculation, live Bancho multiplayer, and global leaderboards.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hatsuneakiko.io.vn">
    <meta property="og:image" content="https://hatsuneakiko.io.vn/static/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="987">
    <meta property="og:image:height" content="213">
    <meta property="og:image:alt" content="{{SERVER_NAME}}">

    <!-- Twitter Card (Discord Large Image Embed) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}} - {{SERVER_NAME}}">
    <meta name="twitter:description" content="A lightweight, high-performance osu! private server powered by Rust with custom PP calculation, live Bancho multiplayer, and global leaderboards.">
    <meta name="twitter:image" content="https://hatsuneakiko.io.vn/static/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260911-diva-banner">
    {{EXTRA_HEAD}}
</head>
<body>
    {{NAVBAR}}
    <main class="main-container">
        {{CONTENT}}
    </main>
    {{FOOTER}}
    <script src="/static/js/main.js"></script>
    {{EXTRA_JS}}
</body>
</html>
